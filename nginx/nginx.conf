upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # 클라이언트 이미지 업로드 용량 제한 (50MB)
    client_max_body_size 50M;

    # 1. React 프론트엔드 정적 파일 서빙 및 SPA 라우팅
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. FastAPI Auth API 라우팅 (/auth/register, /auth/login, /auth/me, /auth/logout)
    location /auth/ {
        proxy_pass http://backend_upstream/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. FastAPI RAG API 라우팅 (/rag/match-image, /rag/image)
    location /rag/ {
        proxy_pass http://backend_upstream/rag/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 4. 서버 헬스체크
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. FastAPI Docs 라우팅
    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }
}