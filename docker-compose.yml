version: '3.8'

services:

  # Redis 캐시 및 세션 저장소
  redis:
    image: redis:7-alpine
    container_name: food-rag-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 2. FastAPI 백엔드 (AWS RDS 직접 연결)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food-rag-backend
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-qwe-s3-pipeline}
      - AWS_S3_IMAGES_PREFIX=${AWS_S3_IMAGES_PREFIX:-images/images}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-inho_secret_key_2026}
    depends_on:
      - redis
    networks:
      - app-network

  # 3. 프론트엔드 빌더
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food-rag-frontend-builder
    volumes:
      - frontend_dist:/dist
    networks:
      - app-network

  # 4. Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: food-rag-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  redis_data:
  frontend_dist:

networks:
  app-network:
    driver: bridge